apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: app
type: Opaque
data:
  # IMPORTANT: Replace these values with your own base64-encoded secrets before applying
  # To encode: echo -n "your-value" | base64
  jwt-secret: REPLACE_WITH_BASE64_JWT_SECRET
  mongo-uri: REPLACE_WITH_BASE64_MONGO_URI
  mongo-root-username: REPLACE_WITH_BASE64_USERNAME
  mongo-root-password: REPLACE_WITH_BASE64_PASSWORD
